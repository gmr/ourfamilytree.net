# DigitalOcean App Platform spec, the same as the live app (doctl apps spec get <app-id>).
# Apply changes with: doctl apps update <app-id> --spec .do/app.yaml
# GOOGLE_CLIENT_SECRET is encrypted by App Platform (EV[...]) and works only for this app.
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
databases:
- cluster_name: ourfamilytree
  db_name: oft
  db_user: oft
  engine: PG
  name: ourfamilytree
  production: true
domains:
- domain: ourfamilytree.net
  type: PRIMARY
envs:
- key: ADMIN_EMAILS
  scope: RUN_TIME
  value: michelle@gavinroy.com,gavinmroy@gmail.com
- key: GOOGLE_CLIENT_ID
  scope: RUN_AND_BUILD_TIME
  value: 751488385288-lkm29gq3vp16me9365goo8vo41auuc1i.apps.googleusercontent.com
- key: GOOGLE_CLIENT_SECRET
  scope: RUN_AND_BUILD_TIME
  type: SECRET
  value: EV[1:pGfML2pygg8WEzvg0c2yJDHQEQ2XnZB6:7Tsx/8dnPH70X7dfRgRQYRIwKbh8i7axRdvbKD730BVwJ2BGzqtbIf9iaUkJda/g5q82]
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: ourfamilytree-net
    match:
      authority:
        exact: ""
      path:
        prefix: /
jobs:
- dockerfile_path: /Dockerfile
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${ourfamilytree.DATABASE_URL}
  - key: DATABASE_CA_CERT
    scope: RUN_TIME
    value: ${ourfamilytree.CA_CERT}
  github:
    branch: main
    deploy_on_push: true
    repo: gmr/ourfamilytree.net
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb-fixed
  kind: PRE_DEPLOY
  name: seed
  run_command: oft-api import-seed
  source_dir: /
name: ourfamilytree
region: nyc
services:
- dockerfile_path: /Dockerfile
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${ourfamilytree.DATABASE_URL}
  - key: DATABASE_CA_CERT
    scope: RUN_TIME
    value: ${ourfamilytree.CA_CERT}
  - key: BASE_URL
    scope: RUN_TIME
    value: ${APP_URL}
  github:
    branch: main
    deploy_on_push: true
    repo: gmr/ourfamilytree.net
  health_check:
    http_path: /health
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb-fixed
  name: ourfamilytree-net
  source_dir: /
vpc:
  id: b957b3e7-dc84-11e8-8650-3cfdfea9f8c8
